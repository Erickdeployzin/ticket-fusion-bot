name: CI • Lint, Typecheck & Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências do projeto e ferramentas de dev
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verificar lint (Ruff)
        run: ruff check src tests scripts

      - name: Verificar formatação (Ruff Format)
        run: ruff format --check src tests scripts

      - name: Verificar tipagem estática (Mypy)
        run: mypy src

      - name: Executar suíte de testes automatizados (Pytest)
        run: pytest -v --tb=short
