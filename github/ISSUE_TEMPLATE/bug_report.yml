name: Reportar Bug
description: Relate um erro, comportamento inesperado ou falha de persistência no Fusion Bot.
title: "[Bug]: "
labels: ["bug", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar um problema! Preencha os campos abaixo com o máximo de detalhes possível (nunca inclua tokens ou senhas reais).

  - type: textarea
    id: description
    attributes:
      label: Descrição do Problema
      description: O que aconteceu e qual era o comportamento esperado?
      placeholder: Ex. Ao clicar em "Fechar Ticket", o canal é bloqueado mas o transcript não é enviado...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Passos para Reproduzir
      description: Liste o passo a passo exato para reproduzir o erro.
      value: |
        1. Execute `/painel` e acesse '...'
        2. Clique em '...'
        3. Observe o erro...
    validations:
      required: true

  - type: dropdown
    id: db_backend
    attributes:
      label: Backend de Banco de Dados (`DB_BACKEND`)
      options:
        - sqlite
        - mysql
        - postgresql
        - mongodb
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Versão do Python e Sistema Operacional
      placeholder: Ex. Python 3.12.4 • Ubuntu 24.04 LTS
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs ou Traceback (opcional)
      description: Cole a saída do terminal ou log relevante (remova tokens e credenciais).
      render: shell