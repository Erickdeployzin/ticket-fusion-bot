[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-bot"
version = "1.0.0"
description = "Bot profissional, modular e multi-database para gerenciamento de grandes comunidades Discord."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Fusion Open Source Contributors" }
]
keywords = ["discord", "discord-py", "tickets", "automation", "bot", "sqlalchemy", "mongodb"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "discord.py>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.3",
    "aiosqlite>=0.20.0",
    "asyncmy>=0.2.9",
    "asyncpg>=0.29.0",
    "pymongo>=4.9.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "jinja2>=3.1.4",
    "aiohttp>=3.10.5",
    "python-dotenv>=1.0.1",
    "redis>=5.1.0",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "types-aiofiles>=24.1.0.20240626",
]
performance = [
    "uvloop>=0.20.0; sys_platform != 'win32'",
    "orjson>=3.10.7",
]

[project.scripts]
fusion-bot = "main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
    "SIM",    # flake8-simplify
]
ignore = [
    "S101",   # assert permitido em testes
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncmy.*", "discord.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"